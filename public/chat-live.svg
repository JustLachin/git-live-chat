<svg fill="none" viewBox="0 0 1200 800" width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Header -->
  <rect y="0" width="1200" height="100" rx="16" fill="#161b22"/>
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#30363d" stroke-width="3"/>
  
  <!-- Title -->
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white">💬 LIVE CHAT</text>
  
  <!-- Online Status -->
  <circle cx="40" cy="80" r="6" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="87" font-family="Arial, sans-serif" font-size="16" fill="#8b949e">Real-time GitHub chat • Click anywhere to join</text>
  
  <!-- Demo Messages -->
  <g transform="translate(40, 150)">
    <!-- Message 1 -->
    <circle cx="25" cy="25" r="25" fill="#238636"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">G</text>
    <rect x="70" y="5" width="500" height="80" rx="20" fill="#21262d"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e">@github</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="16" fill="#c9d1d9">Welcome to Git Live Chat! 🚀</text>
  </g>
  
  <g transform="translate(40, 270)">
    <!-- Message 2 -->
    <circle cx="25" cy="25" r="25" fill="#1f6feb"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">O</text>
    <rect x="70" y="5" width="600" height="80" rx="20" fill="#21262d"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#8b949e">@octocat</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="16" fill="#c9d1d9">Real-time messaging powered by Pusher &amp; GitHub OAuth</text>
  </g>
  
  <g transform="translate(40, 390)">
    <!-- Message 3 -->
    <circle cx="25" cy="25" r="25" fill="#da3633"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">J</text>
    <rect x="70" y="5" width="450" height="80" rx="20" fill="#1f6feb"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">@JustLachin</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="16" fill="white">Join us and start chatting! 💬</text>
  </g>
  
  <!-- CTA Box -->
  <rect x="300" y="520" width="600" height="180" rx="20" fill="#238636" filter="url(#shadow)"/>
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="64" text-anchor="middle">🚀</text>
  <text x="600" y="640" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">CLICK TO JOIN CHAT</text>
  <text x="600" y="675" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">Sign in with GitHub • Start chatting instantly</text>
  
  <!-- Input Area -->
  <rect y="720" width="1200" height="80" fill="#161b22"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#30363d" stroke-width="3"/>
  <rect x="40" y="740" width="1000" height="45" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="768" font-family="Arial, sans-serif" font-size="16" fill="#6e7681">Type your message...</text>
  <rect x="1060" y="740" width="120" height="45" rx="10" fill="#238636"/>
  <text x="1120" y="768" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Send 🚀</text>
  
  <!-- Clickable overlay -->
  <a href="https://git-live-chat.vercel.app" target="_blank">
    <rect width="1200" height="800" fill="transparent" cursor="pointer"/>
  </a>
</svg>
