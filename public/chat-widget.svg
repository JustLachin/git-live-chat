<svg fill="none" viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        .chat-container {
          width: 800px;
          height: 600px;
          background: #0d1117;
          border-radius: 12px;
          border: 2px solid #30363d;
          display: flex;
          flex-direction: column;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .chat-header {
          background: #161b22;
          padding: 20px;
          border-bottom: 2px solid #30363d;
          border-radius: 12px 12px 0 0;
        }
        .chat-title {
          color: white;
          font-size: 24px;
          font-weight: 900;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .chat-subtitle {
          color: #8b949e;
          font-size: 14px;
          margin-top: 8px;
        }
        .chat-body {
          flex: 1;
          padding: 20px;
          overflow-y: auto;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .chat-cta {
          text-align: center;
        }
        .chat-emoji {
          font-size: 80px;
          margin-bottom: 20px;
        }
        .chat-text {
          color: #c9d1d9;
          font-size: 18px;
          margin-bottom: 30px;
        }
        .chat-button {
          background: #238636;
          color: white;
          border: none;
          padding: 16px 32px;
          border-radius: 8px;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          text-decoration: none;
          transition: all 0.3s;
        }
        .chat-button:hover {
          background: #2ea043;
          transform: scale(1.05);
        }
        .online-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: #21262d;
          padding: 6px 12px;
          border-radius: 20px;
          font-size: 12px;
          color: #8b949e;
          margin-top: 10px;
        }
        .online-dot {
          width: 8px;
          height: 8px;
          background: #3fb950;
          border-radius: 50%;
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-title">💬 LIVE CHAT</div>
          <div class="chat-subtitle">Real-time GitHub-powered messaging</div>
          <div class="online-badge">
            <span class="online-dot"></span>
            <span>Click to join the conversation</span>
          </div>
        </div>
        <div class="chat-body">
          <div class="chat-cta">
            <div class="chat-emoji">🚀</div>
            <div class="chat-text">Join the live chat and connect with developers!</div>
            <a href="https://git-live-chat.vercel.app" class="chat-button" target="_blank">
              <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
              Open Live Chat
            </a>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
